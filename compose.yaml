services:
  hbm:
    build: .
    image: vps-heartbeat-monitor:latest
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机监听，由 Caddy/Nginx 提供 HTTPS 反代
    volumes:
      - hbm-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
volumes:
  hbm-data:
